plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.74'
}

version = '1.2.0'
group = 'com.xing_yu_dragon.timeheals'

base {
    archivesName = 'time_heals'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        time_heals {
            sourceSet(sourceSets.main)
        }
    }
}

/** 整合包 mods 目录（编译期引用 + dev 运行挂载都从这里取） */
def packMods = 'D:/MC/HMCL-3.5.4/.minecraft/versions/整合包/mods'

dependencies {
    // ===== 编译期依赖：龙之进化 + 其前置 BrandonsCore =====
    // 只用于编译，运行期由整合包提供，不会打进本模组 jar
    compileOnly files("$packMods/[龙之进化／龙之研究] Draconic-Evolution-1.21.1-3.1.4.632.jar")
    compileOnly files("$packMods/BrandonsCore-1.21.1-3.2.1.309.jar")
    // GuideME（内置说明文档，AE2 指南同款框架）
    compileOnly files("$packMods/guideme-21.1.19.jar")
    // Jade（HUD 提示，只用于编译，运行期由整合包提供）
    compileOnly files("devmods/jade-1.21.1-neoforge-15.10.6.jar")

    // ===== 仅 IDEA dev 调试用（runClient/runServer）=====
    // 约定：dev 运行需要的整合包模组，统一复制到工程内 devmods/，文件名一律纯英文。
    // 原因：整合包里不少 jar 带中文/emoji 前缀，其中 emoji（如 [玉 🔍] 的 🔍）
    // 在 Windows 下传给 JVM 的启动参数会丢字符，导致该模组被静默跳过。
    //   - Draconic-Evolution + BrandonsCore + CodeChickenLib（龙研及其前置）
    //   - KubeJS 主模组 + Rhino + Architectury（时间系列物品来自 KubeJS 脚本）
    //   - GuideME（KubeJS/DE 的指南书前置）
    //   - Jade（信息显示，调试用）
    // 不加载 KubeJS 附属（kubejs-mekanism / kubejspowah / kubejsde），
    // 它们强依赖 Mekanism / Powah 等未挂载模组，会导致启动时缺失依赖报错。
    // runtimeOnly 不会打进发布 jar，产物保持不变。
    runtimeOnly fileTree('devmods') {
        include '*.jar'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
